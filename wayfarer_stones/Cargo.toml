[package]
name = "mod-wayfarer_stones"
version = "0.9.0"
edition = "2024"
license = "MIT"
publish = false
description = "Wayfarer Stones for Sunrise: place a stone, activate it, travel between the ones you know."

[dependencies]
# The pinned SDK's API crate, fetched into .sunrise/sdk/ by any `cargo sunrise-mod` command.
sunrise-mod-api = { path = ".sunrise/sdk/api/crates/sunrise-mod-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
